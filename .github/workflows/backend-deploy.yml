name: Backend Deploy to Ikoula

on:
  push:
    branches:
      - master
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema apps/backend/prisma/schema.prisma
      - run: npx tsc --noEmit --project apps/backend/tsconfig.json

  deploy:
    name: Deploy to Ikoula (PM2)
    runs-on: ubuntu-latest
    environment: production
    needs: typecheck

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IKOULA_HOST }}
          username: ${{ secrets.IKOULA_USER }}
          key: ${{ secrets.IKOULA_SSH_KEY }}
          port: ${{ secrets.IKOULA_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /d F:\Github\alternance-offer-crawler
            git pull origin master
            if errorlevel 1 exit /b 1
            call apps\backend\scripts\deploy.bat
            if errorlevel 1 exit /b 1

      - name: Health check
        run: |
          sleep 5
          curl -f https://api-alternance.your-domain.com/api/health || exit 1

      - name: Notify Slack (optional)
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "alternance-offer-crawler backend deploy ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Backend Deployment* ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
